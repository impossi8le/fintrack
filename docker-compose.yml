version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintrack_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
      - "5173:5173" # Vite dev server
    depends_on:
      - mysql
      - redis
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: fintrack
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: >
      sh -c "
        composer install &&
        npm install &&
        php artisan key:generate &&
        php artisan migrate --force &&
        npm run build &&
        php artisan serve --host=0.0.0.0 --port=8000 
      "

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintrack_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: fintrack
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: >
      sh -c "
        composer install &&
        php artisan migrate --force &&
        php artisan queue:work --verbose --tries=3 --timeout=90
      "

  mysql:
    image: mysql:8.0
    container_name: fintrack_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fintrack
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: fintrack_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql

  redis:
    image: redis:7-alpine
    container_name: fintrack_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data:
